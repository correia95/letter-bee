    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Letter Bee",
        "url": "https://letter-bee.correia95.workers.dev/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "genre": "Word puzzle",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "A daily seven-letter word puzzle where you make words using a required centre letter, find pangrams and climb the ranks, the same for every player each day."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What are the rules of Letter Bee?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Make words from the seven letters shown. Every word must be at least four letters long and must include the centre letter. Letters can be reused. A word that uses all seven letters is a pangram and scores a bonus."
            }
          },
          {
            "@type": "Question",
            "name": "How is the score worked out?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A four-letter word scores one point. Longer words score one point per letter. A pangram adds seven points. Your total moves you up the ranks from Beginner to Queen Bee, which is every word."
            }
          },
          {
            "@type": "Question",
            "name": "Is it the same puzzle for everyone?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The hive is generated from the date, so every player gets the same seven letters each day. A new one appears at midnight UTC and your progress is saved in your browser."
            }
          },
          {
            "@type": "Question",
            "name": "Why was my word rejected?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Answers come from the public-domain ENABLE word list, which omits proper nouns and words containing S. It is not identical to an official Scrabble dictionary, so a few valid-looking words are not accepted."
            }
          }
        ]
      }
    </script>
